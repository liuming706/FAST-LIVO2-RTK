# Virtual pinhole camera produced by rectify_mei.py; NOT the raw MEI intrinsics.
# 320 px focal length keeps the 640x480 rectified image inside the source image.
# Rectification leaves the optical axes unchanged, so Rcl/Pcl remain valid.
cam_model: Pinhole
cam_width: 640
cam_height: 480
scale: 1.0
cam_fx: 320.0
cam_fy: 320.0
cam_cx: 319.5
cam_cy: 239.5
cam_d0: 0.0
cam_d1: 0.0
cam_d2: 0.0
cam_d3: 0.0
